[project]
name = "quant-mcp-poc"
version = "0.1.0"
description = "MCP framework for existing Python libraries and smolagents coding tasks"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.29.0,<2",
    "anyio>=4.5",
    "pydantic>=2.11",
    "opentelemetry-api>=1.30,<2",
    "smolagents[openai]>=1.26,<2",
]

[project.optional-dependencies]
telemetry = [
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
testing = [
    "pyyaml>=6.0",
]
[dependency-groups]
dev = [
    "pytest>=7.4,<8",
    "opentelemetry-sdk>=1.30,<2",
]
examples = [
    "scipy>=1.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
quant-mcp-test = "quant_mcp.testing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "examples"]
testpaths = ["tests", "examples/tests"]

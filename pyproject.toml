[project]
name = "quant-mcp-poc"
version = "0.1.0"
description = "POC MCP server for dynamic option portfolio analysis"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scipy>=1.12",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
smolagents-demo = [
    "smolagents[openai]>=1.17,<2",
]

[dependency-groups]
dev = [
    "pytest>=7.4,<8",
]

[project.scripts]
quant-mcp = "quant_mcp.server:main"
quant-cli = "quant_mcp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
